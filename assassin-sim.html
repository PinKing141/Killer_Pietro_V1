<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLORIA — Observer Protocol</title>
<link rel="stylesheet" href="./styles/assassin-sim.css">
</head>
<body>

<header>
  <div class="logo">Gloria Club — Observer Protocol</div>
  <div class="tagline">You may watch. You may not intervene.</div>
  <div class="header-right">
    <span>DATE <span class="world-tick" id="world-tick">01/01/2000</span></span>
    <input id="debug-passcode" class="debug-passcode" type="password" maxlength="24" placeholder="DEBUG PASSCODE">
    <button id="btn-debug-unlock" class="ctrl-btn debug-btn" type="button">UNLOCK</button>
    <span id="debug-range-bands" class="debug-range-bands tooltip-anchor" data-tooltip="Stat level bands unavailable">RANGES</span>
    <span id="debug-status" class="debug-status">LOCKED</span>
  </div>
</header>

<div class="layout">

  <div class="panel">
    <div class="panel-header">Subjects — <span id="alive-count">0</span> tracked</div>
    <div class="roster-controls">
      <button class="ctrl-btn roster-mode-btn active" data-roster-mode="all">All</button>
      <button class="ctrl-btn roster-mode-btn" data-roster-mode="trainees">Trainees</button>
      <button class="ctrl-btn roster-mode-btn" data-roster-mode="operatives">Operatives</button>
      <button class="ctrl-btn roster-mode-btn" data-roster-mode="favorites">Favorites</button>
      <select id="trainee-age-filter" aria-label="Trainee age filter">
        <option value="all">All ages</option>
        <option value="8-10">8-10</option>
        <option value="11-13">11-13</option>
        <option value="14-16">14-16</option>
      </select>
    </div>
    <div id="roster"></div>
  </div>

  <div class="center-panel">
    <div class="scene-view" id="scene-view">
      <div class="empty-state">
        <span>SELECT A SUBJECT</span>
        to observe their path
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btn-pause">PAUSE</button>
      <button class="ctrl-btn speed-btn" data-speed="1">1×</button>
      <button class="ctrl-btn speed-btn" data-speed="3">3×</button>
      <button class="ctrl-btn speed-btn active" data-speed="5">5×</button>
      <button class="ctrl-btn" id="btn-spawn">+ INTAKE</button>
      <div class="speed-indicator">SPEED <span id="speed-label">5×</span></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="panel-header right-panel-header">
      <span>Right Panel</span>
      <div class="right-panel-modes">
        <button class="ctrl-btn right-panel-mode-btn active" data-right-panel-mode="feed">Feed</button>
        <button class="ctrl-btn right-panel-mode-btn" data-right-panel-mode="map">World Map</button>
        <button class="ctrl-btn right-panel-mode-btn" data-right-panel-mode="apostles">Apostles</button>
      </div>
    </div>
    <div class="intake-board" id="intake-board">
      <div class="intake-board-title">Intake Audit</div>
      <div class="intake-row"><span>Year</span><span id="intake-year">2026</span></div>
      <div class="intake-row"><span>Current Year Intake</span><span id="intake-count">0</span></div>
      <div class="intake-row"><span>Died In Trial</span><span id="intake-died">0</span></div>
      <div class="intake-row"><span>Passed To Trainee</span><span id="intake-passed">0</span></div>
    </div>
    <div id="world-feed"></div>
    <div id="world-map" class="world-map-view"></div>
    <div id="apostle-panel" class="apostle-panel-view"></div>
  </div>

</div>

<script type="module" src="./scripts/main.js"></script>
</body>
</html>
